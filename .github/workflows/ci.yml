name: NeuroDebug CI

on:
  push:
    branches:
      - main
      - jules-2453977863031422642-2bffc80b
      - develop
      - "ft/patch"
      - "feature/week1-patch-generation"
      - "feature/week2-verification-engine"
      - "feature/week3-saas-foundation"
      - "feature/readme"
      - "bugfix/docker"
      - "hotfix/api"
  pull_request:
    branches:
      - main
      - jules-2453977863031422642-2bffc80b

jobs:

  backend:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neurodebug
          POSTGRES_PASSWORD: neurodebug
          POSTGRES_DB: neurodebug_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Development Tools
        run: |
          pip install pytest
          pip install pytest-asyncio
          pip install ruff
          pip install black

      - name: Run Ruff
        run: |
          ruff check .

      - name: Check Formatting
        run: |
          black --check .

      # - name: Run Tests
      #   env:
      #     DATABASE_URL: postgresql+asyncpg://neurodebug:neurodebug@localhost:5432/neurodebug_test
      #   run: |
      #     pytest

  frontend:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: Run Lint
        run: |
          npm run lint

      - name: Build
        run: |
          npm run build