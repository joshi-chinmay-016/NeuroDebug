name: NeuroDebug CI

on:
  push:
    branches:
      - main
      - develop
      - "ft/patch"
      - "feature/week1-patch-generation"
      - "feature/week2-verification-engine"
      - "feature/week3-redis"
      - "feature/readme"
      - "bugfix/docker"
      - "hotfix/api"
  pull_request:
    branches:
      - main
      
jobs:

  backend:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Development Tools
        run: |
          pip install pytest
          pip install ruff
          pip install black

      - name: Run Ruff
        run: |
          ruff check .

      - name: Check Formatting
        run: |
          black --check .

      - name: Run Tests
        run: |
          pytest