# ──────────────────────────────────────────────────────────────────
# NeuroDebug — Docker Compose
# Services: PostgreSQL + backend (FastAPI) + frontend (React/nginx)
# (Zero Redis Dependency — PostgreSQL is Authoritative Persistence)
# ──────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL Database ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: neurodebug_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neurodebug
      POSTGRES_PASSWORD: neurodebug
      POSTGRES_DB: neurodebug
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurodebug"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neurodebug_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Backend: FastAPI ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neurodebug_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://neurodebug:neurodebug@postgres:5432/neurodebug
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - neurodebug_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Frontend: React + nginx ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neurodebug_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - neurodebug_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# ── Volumes ───────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

# ── Shared network ────────────────────────────────────────────────
networks:
  neurodebug_net:
    driver: bridge
